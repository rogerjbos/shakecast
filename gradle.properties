org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release identity. Bump versionCode for every Play upload; versionName is what people see.
shakecast.versionCode=1
shakecast.versionName=1.0.0
# Sentry DSN for opt-in crash reports. Empty disables crash reporting entirely.
# Override per machine with -Pshakecast.sentryDsn=... or SHAKECAST_SENTRY_DSN.
shakecast.sentryDsn=
# Supabase project baked into the build so users only create an account. Blank keeps the
# URL and key fields in Settings. Override per machine in ~/.gradle/gradle.properties or
# with SHAKECAST_SUPABASE_URL / SHAKECAST_SUPABASE_KEY. The publishable key is public by design.
shakecast.supabaseUrl=
shakecast.supabaseKey=
